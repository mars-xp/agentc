name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: install portable deps
        run: python3 -m pip install -r requirements/plugin-validator.txt
      - name: run copied unit tests
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path
          failed = []
          env = os.environ.copy()
          env["PYTHONPATH"] = os.pathsep.join(("src", "scripts"))
          for path in sorted(Path("scripts/tests").glob("test_*.py")):
              code = subprocess.run(
                  [sys.executable, str(path)],
                  env=env,
              ).returncode
              if code != 0:
                  failed.append(path.name)
          if failed:
              raise SystemExit("red tests (exclude them, do not patch compiler): " + ",".join(failed))
          PY
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: build one wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          python -c "import glob,hashlib,pathlib; w=glob.glob('dist/*.whl'); assert len(w)==1, w; p=pathlib.Path(w[0]); print(p.name, hashlib.sha256(p.read_bytes()).hexdigest())"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentc-wheel
          path: dist/*.whl
          if-no-files-found: error
  smoke:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agentc-wheel
          path: wheel-dist
      - name: install the same wheel
        run: python -c "import glob,subprocess,sys; w=glob.glob('wheel-dist/*.whl'); assert len(w)==1, w; subprocess.check_call([sys.executable,'-m','pip','install',w[0]])"
      - name: smoke help
        run: python -m agentc --help
      - name: smoke init
        run: python -m agentc init ./smoke-agent --id smoke --name Smoke --targets cursor
      - name: smoke validate
        run: python -m agentc validate ./smoke-agent
      - name: smoke build
        run: python -m agentc build ./smoke-agent
      - name: smoke package
        run: python -m agentc package ./smoke-agent
      - name: smoke audit
        run: python -m agentc audit --for-public ./smoke-agent
      - name: smoke skill on three hosts
        run: python -m agentc init ./smoke-skill --id skill --name Skill --targets all
      - name: create anonymous skill
        run: python -m agentc create skill hello --project ./smoke-skill
      - name: validate anonymous skill
        run: python -m agentc validate ./smoke-skill
      - name: build anonymous skill
        run: python -m agentc build ./smoke-skill
      - name: package anonymous skill
        run: python -m agentc package ./smoke-skill
